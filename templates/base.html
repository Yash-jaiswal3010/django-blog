<!--Header Part-->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css'%}" rel="stylesheet">
    <style>
    .user-status {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        background: #f1f5f9;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        color: #495057;
        font-size: 14px;
    }

    .user-status strong {
        color: #1f3a5f;
        font-weight: 600;
    }

    .user-status .btn {
        margin-left: 8px;
    }
</style>
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-8 pt-1">
            <a class="blog-header-logo text-dark" href="/">Django Blog</a>
          </div>
          <div class="col-4">
            <form action="{% url 'search' %}" method="GET">
              <div class="input-group">
                <input class="form-control" type="text" name="keyword" value="{{ keyword }}" placeholder="Enter search term..." aria-label="Enter search term..." aria-describedby="button-search" />
                <button type="submit" class="btn btn-warning" id="button-search" type="button">Go!</button>
            </div>
            </form>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            {% if not user.is_authenticated %}
            <a class="btn btn-sm btn-warning" href="{% url 'login' %}">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">Register</a>
           {% else %}
            <div class="user-status">
            <span>You are logged in as</span>
            <strong>{{ user.username }}</strong>
            </div>

    <a class="btn btn-sm btn-warning ml-2" href="{% url 'logout' %}">
        Logout
    </a>
{% endif %}
          </div>
        </div>
      </header>

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for cat in categories %}
          <a class="p-2 text-muted" href="{% url 'posts_by_catgory' cat.id %}">{{ cat }}</a>
          {% endfor %}
        </nav>
      </div>

<!--Maincontent Part-->
{% block content %}

{% endblock %}
<!--footer Part-->
<footer class="blog-footer">
  <p>Django blog built with ❤️ by <a href="#">Yash Jaiswal</a></p>
</footer>
</body>
</html>
